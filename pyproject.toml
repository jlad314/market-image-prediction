[project]
name = "market-image-prediction"
version = "0.1.0"
description = "Neural image prediction for financial market state: GAF/IV-surface/LOB image models with walk-forward validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.2.0",
    "duckdb>=1.5.5",
    "einops>=0.8.1",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.1",
    "pandas-market-calendars>=5.4.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.15.0",
    "pyts>=0.13.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "torch>=2.13.0",
    "typer>=0.27.1",
    "wrds>=3.5.0",
    "yfinance>=0.2.54",
]

[project.scripts]
market-image-prediction = "market_image_prediction.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

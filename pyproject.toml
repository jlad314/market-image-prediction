[project]
name = "market-image-prediction"
version = "0.1.0"
description = "Neural image prediction for financial market state: GAF/IV-surface/LOB image models with walk-forward validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.2.0",
    "duckdb>=1.5.5",
    "einops>=0.8.1",
    "lightgbm>=4.6.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.1",
    "pandas-market-calendars>=5.4.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.15.0",
    "pyts>=0.13.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "torch>=2.13.0",
    "typer>=0.27.1",
    "yfinance>=0.2.54",
]

[project.scripts]
market-image-prediction = "market_image_prediction:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
